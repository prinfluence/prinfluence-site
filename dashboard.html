<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Products — Prinfluence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HHHE3BLPL3"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-HHHE3BLPL3");</script>
<style>
:root{
  --paper:#F6F3EE;--panel:#FFFFFF;
  --ink:#1C1620;--ink-soft:rgba(28,22,32,0.62);--ink-faint:rgba(28,22,32,0.38);
  --line:rgba(28,22,32,0.10);--line-soft:rgba(28,22,32,0.05);
  --rose:#CE4E84;--gold:#C5A062;
  --font-display:"Fraunces",Georgia,serif;--font-sans:"DM Sans",sans-serif;
  --maxw:1100px;--gut:clamp(24px,5vw,56px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(206,78,132,.06),transparent),radial-gradient(ellipse 50% 30% at 100% 100%,rgba(197,160,98,.07),transparent);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:44px var(--gut) 90px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px;flex-wrap:wrap;gap:16px}
.brandmark .word{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.logo-influence{background:linear-gradient(100deg,#E9C977 0%,#D7A964 20%,#E29ABF 52%,#A99AEC 74%,#7EB8FF 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-it{font-style:italic;font-weight:500;-webkit-text-fill-color:transparent}
.member-pill{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:10px 18px;font-size:13.5px;color:var(--ink-soft)}
.member-email{color:var(--ink);font-weight:600}
.logout-btn{font-size:12.5px;color:var(--rose);cursor:pointer;font-weight:500;padding-left:14px;border-left:1px solid var(--line)}
.logout-btn:hover{text-decoration:underline}
.hero{background:#1C1620;border-radius:24px;overflow:hidden;margin-bottom:56px}
.hero-inner{display:grid;grid-template-columns:1.3fr 1fr;min-height:240px}
.hero-text{padding:48px var(--gut);position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero-eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#F0CFA0;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before{content:'';width:22px;height:1px;background:currentColor}
.hero-title{font-family:var(--font-display);font-size:clamp(26px,3.5vw,38px);font-weight:400;color:#fff;letter-spacing:-.02em;line-height:1.1}
.hero-title em{font-style:italic;font-weight:500;background:linear-gradient(100deg,#F0CFA0,#F5ADCE,#C8A0F0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-img-wrap{position:relative;overflow:hidden}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.hero-img-fade{position:absolute;inset:0;background:linear-gradient(90deg,#1C1620 0%,rgba(28,22,32,.1) 40%,transparent 70%)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.section-eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:600;margin-bottom:8px}
.section-title{font-family:var(--font-display);font-size:24px;font-weight:500;letter-spacing:-.01em}
.section-meta{font-size:13px;color:var(--ink-faint)}
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-faint);font-size:14px;padding:80px 0;justify-content:center}
.spinner{width:16px;height:16px;border:2px solid rgba(206,78,132,.2);border-top-color:var(--rose);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.product-card{background:var(--panel);padding:32px;display:flex;flex-direction:column;transition:background .25s;position:relative}
.product-card.unlocked:hover{background:#FFFDFB}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.product-card.unlocked::before{background:var(--rose)}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.status-badge{font-size:11px;font-weight:600;padding:5px 13px;border-radius:100px;display:flex;align-items:center;gap:7px}
.status-badge.unlocked{background:rgba(168,230,193,.25);color:#2F6B47}
.status-badge.locked{background:var(--paper);color:var(--ink-faint)}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-badge.unlocked .status-dot{background:#2F6B47}
.status-badge.locked .status-dot{background:var(--ink-faint)}
.product-num{font-family:var(--font-display);font-size:13px;color:var(--ink-faint);font-style:italic}
.product-title{font-family:var(--font-display);font-size:22px;font-weight:500;margin-bottom:9px;letter-spacing:-.01em;line-height:1.2}
.product-desc{font-size:14px;color:var(--ink-soft);line-height:1.65;margin-bottom:24px;font-weight:300;flex:1}
.action-btn{display:inline-flex;align-items:center;gap:9px;padding:14px 0;font-size:14px;font-weight:600;text-decoration:none;transition:gap .25s;align-self:flex-start;border-bottom:1.5px solid;font-family:var(--font-sans)}
.action-btn.unlocked{color:var(--ink);border-color:var(--ink)}
.action-btn.unlocked:hover{gap:14px;color:var(--rose);border-color:var(--rose)}
.action-btn.locked{color:var(--ink-faint);border-color:var(--line)}
.action-btn.locked:hover{gap:14px;color:var(--ink-soft)}
.purchased-date{font-size:11.5px;color:var(--ink-faint);margin-top:12px}
@media(max-width:760px){.products-grid{grid-template-columns:1fr}.hero-inner{grid-template-columns:1fr}.hero-img-wrap{display:none}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brandmark">
      <span class="word">Prin<span class="logo-influence"><span class="logo-it">fluence</span></span></span>
    </div>
    <div class="member-pill" id="memberPill" style="display:none">
      <span>Signed in as <span class="member-email" id="memberEmail">—</span></span>
      <span class="logout-btn" onclick="logout()">Sign out</span>
    </div>
  </div>

  <div class="loading" id="loadingState">
    <div class="spinner"></div> Checking your account...
  </div>

  <div id="mainContent" style="display:none">
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <div class="hero-eyebrow">Member dashboard</div>
          <div class="hero-title">Everything you've unlocked, <em>all in one place.</em></div>
        </div>
        <div class="hero-img-wrap">
          <img class="hero-img" src="images/post-jumpsuit.webp" alt="">
          <div class="hero-img-fade"></div>
        </div>
      </div>
    </div>

    <div class="section-head">
      <div>
        <div class="section-eyebrow">Your library</div>
        <div class="section-title">My products</div>
      </div>
      <div class="section-meta" id="sectionMeta"></div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://xavhjbcmqgoznuggzpep.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oKv6t4MSb9mG8ggGedTwyQ_ZO3WeNEr';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PRODUCTS = [
  { key:'content-vault', num:'01', title:'The Content Vault', desc:'Monthly-refreshed library of hooks, ideas & CTAs across 7 niches, plus the AI remix engine.', url:'content-vault.html', landingUrl:'content-vault-landing.html' },
  { key:'outreach-tracker', num:'02', title:'Outreach Tracker + AI Pitch Analyzer', desc:'Track every brand conversation, calculate your rates, and analyze pitches with AI.', url:'outreach-tracker.html', landingUrl:'outreach-tracker-landing.html' },
  { key:'pitch-paid', num:'03', title:'[Pitch] $Paid, Period.', desc:'10 pitch templates across 8 niches, built on the P.A.I.D. Framework.', url:'pitch-paid.html', landingUrl:'pitch-paid-landing.html' },
  { key:'dealworthy', num:'04', title:'Deal Worthy — UGC Starter Kit', desc:'The complete brand-deal playbook: 12 pitch templates, rate calculator, 200+ brand list, contracts.', url:'dealworthy.html', landingUrl:'dealworthy-landing.html' }
];

async function init() {
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const email = session.user.email;
  document.getElementById('memberEmail').textContent = email;
  document.getElementById('memberPill').style.display = 'flex';

  // Load purchases by email
  const { data, error } = await sb
    .from('purchases')
    .select('product, created_at')
    .eq('email', email);

  if (error) {
    console.error(error);
    document.getElementById('loadingState').innerHTML = '<div style="color:var(--ink-soft)">Error loading products. Please refresh.</div>';
    return;
  }

  const purchasedMap = {};
  (data || []).forEach(p => { purchasedMap[p.product] = p.created_at; });

  const unlockedCount = Object.keys(purchasedMap).length;
  document.getElementById('sectionMeta').textContent = `${unlockedCount} of ${PRODUCTS.length} unlocked`;

  document.getElementById('productsGrid').innerHTML = PRODUCTS.map(p => {
    const unlocked = !!purchasedMap[p.key];
    const dateStr = unlocked ? new Date(purchasedMap[p.key]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : null;
    return `
      <div class="product-card ${unlocked ? 'unlocked' : 'locked'}">
        <div class="card-top">
          <span class="product-num">${p.num}</span>
          <div class="status-badge ${unlocked ? 'unlocked' : 'locked'}">
            <span class="status-dot"></span> ${unlocked ? 'Unlocked' : 'Not purchased'}
          </div>
        </div>
        <div class="product-title">${p.title}</div>
        <div class="product-desc">${p.desc}</div>
        ${unlocked
          ? `<a class="action-btn unlocked" href="${p.url}">Open product →</a><div class="purchased-date">Purchased ${dateStr}</div>`
          : `<a class="action-btn locked" href="${p.landingUrl}">View &amp; unlock →</a>`}
      </div>`;
  }).join('');

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

// Handle magic link redirect
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) init();
});

init();
</script>
</body>
</html>
