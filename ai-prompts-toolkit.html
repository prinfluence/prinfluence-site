document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ion:none;color:var(--ink2);font-size:14px;font-weight:600;padding:9px 14px;border-radius:100px;border:1px solid var(--line);transition:all .2s}\n.cats a:hover{color:var(--ink);border-color:var(--pink)}\n.search{flex:none;width:min(220px,40vw);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:100px;color:var(--ink);font:15px var(--sans);padding:10px 16px;outline:0}\n.search:focus{border-color:var(--pink)}\n.search::placeholder{color:var(--faint)}\nsection.cat{padding:clamp(48px,6vw,72px) 0 0}\n.cat-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}\n.cat-num{font-family:var(--mono);font-size:13px;color:var(--rose);letter-spacing:.1em}\n.cat-head h2{font-family:var(--disp);font-weight:500;font-size:clamp(28px,3.6vw,40px);letter-spacing:-.02em;margin:0}\n.cat-head p{color:var(--faint);margin:0;font-size:15px;flex-basis:100%}\n.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}\n.p{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;background:var(--card);transition:border-color .25s,transform .25s}\n.p:hover{border-color:rgba(245,173,206,.45);transform:translateY(-2px)}\n.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px}\n.p-n{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.08em}\n.p-for{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:100px;border:1px solid var(--line);color:var(--ink2)}\n.p h3{font-size:17px;font-weight:700;margin:10px 0 8px;letter-spacing:-.005em}\n.p-text{font-size:15px;color:var(--ink2);margin:0;flex:1;white-space:pre-line}\n.p-text mark{background:rgba(232,201,142,.16);color:var(--gold);border-radius:5px;padding:0 4px}\n.copy{align-self:flex-start;margin-top:14px;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 16px;border-radius:100px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:600 13px var(--sans);cursor:pointer;transition:all .2s}\n.copy:hover{border-color:var(--pink);background:rgba(245,173,206,.1)}\n.copy.done{background:var(--grad);color:#150C1E;border-color:transparent}\n.empty{display:none;text-align:center;color:var(--faint);padding:60px 0 0}\n.foot{margin-top:clamp(70px,9vw,110px);border-top:1px solid var(--line);padding:56px 0 70px;text-align:center}\n.foot h2{font-family:var(--disp);font-weight:500;font-size:clamp(28px,4vw,42px);letter-spacing:-.02em;margin:0 auto;max-width:20ch;text-wrap:balance}\n.foot h2 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}\n.foot p{color:var(--ink2);max-width:48ch;margin:14px auto 0}\n.btn{display:inline-flex;align-items:center;gap:8px;margin-top:26px;min-height:50px;padding:0 28px;border-radius:100px;background:var(--grad);color:#150C1E;font-weight:700;text-decoration:none}\n.btn:hover{color:#150C1E;filter:brightness(1.05)}\n.fine{font-size:13px;color:var(--faint);margin-top:30px}\n@media(max-width:760px){.list{grid-template-columns:1fr}.how{grid-template-columns:1fr}.bar .wrap{flex-wrap:wrap}.search{width:100%}}\n@media print{\n:root{--bg:#fff;--card:#fff;--ink:#1a1320;--ink2:#3d3445;--faint:#6b6170;--line:#ddd}\n.bar,.copy,.hero::before{display:none}\n.p{break-inside:avoid;transform:none!important}\n.p-text mark{background:#f6ead2;color:#6b4f1d}\n.tag,.btn{border:1px solid #ccc}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<header class=\"hero\">\n<div class=\"wrap\">\n<div class=\"logo\">Pr<em>influence<\u002Fem><\u002Fdiv>\n<span class=\"tag\">Free for subscribers of The Refresh<\u002Fspan>\n<h1>The 50 AI <em>Prompts Toolkit<\u002Fem><\u002Fh1>\n<p class=\"lede\">Fifty copy-paste prompts for content that sells. They work in ChatGPT, Claude or Gemini, for brands and creators.<\u002Fp>\n<div class=\"how\">\n<div><b>01 · Copy<\u002Fb><span>Tap \"Copy prompt\" on any card.<\u002Fspan><\u002Fdiv>\n<div><b>02 · Fill in<\u002Fb><span>Swap the <span style=\"color:var(--gold)\">[gold brackets]<\u002Fspan> for your own details.<\u002Fspan><\u002Fdiv>\n<div><b>03 · Refine<\u002Fb><span>Follow up with \"make it shorter,\" \"punchier\" or \"more like me.\"<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n<nav class=\"bar\"><div class=\"wrap\"><div class=\"cats\" id=\"cats\"><\u002Fdiv><input class=\"search\" id=\"search\" type=\"search\" placeholder=\"Search prompts\" aria-label=\"Search prompts\"><\u002Fdiv><\u002Fnav>\n<main class=\"wrap\" id=\"main\"><\u002Fmain>\n<p class=\"empty wrap\" id=\"empty\">No prompts match that search.<\u002Fp>\n<footer class=\"foot wrap\">\n<h2>Want the next batch <em>before anyone else?<\u002Fem><\u002Fh2>\n<p>New prompts, tools and AI workflows land in The Refresh every Sunday. Your 30% off code is in your welcome email.<\u002Fp>\n<a class=\"btn\" href=\"Home.html\">Visit Prinfluence <span>→<\u002Fspan><\u002Fa>\n<div class=\"fine\">© Prinfluence · AI marketing for brands and creators<\u002Fdiv>\n<\u002Ffooter>\n<script>\nconst P = [\n{c:\"Ideas & Strategy\",d:\"Never run out of things to post.\",items:[\n[\"Both\",\"30-day content plan\",\"Act as a content strategist. Build a 30-day content calendar for [brand/creator] in the [niche] space, targeting [audience]. Mix education, entertainment, proof and promotion. For each day give the platform, format, topic and a one-line hook.\"],\n[\"Both\",\"Content pillars\",\"Define 4 content pillars for [brand/creator] whose goal is [goal]. For each pillar, explain why it matters to [audience] and list 5 post ideas under it.\"],\n[\"Both\",\"Audience pain points\",\"List the top 15 frustrations, fears and desires of [audience] when it comes to [topic]. Group them by theme, then turn each into a post idea.\"],\n[\"Both\",\"Trend to content\",\"Here is a trend: [trend]. Give me 5 ways [brand/creator] can use it without feeling forced, each tied to [product/offer or message].\"],\n[\"Brands\",\"Competitor gap finder\",\"Here are posts from [competitor]: [paste]. Identify what topics they cover well, what they ignore, and 10 content ideas that fill the gaps for [brand].\"],\n[\"Creators\",\"Niche positioning\",\"I create content about [topic] for [audience]. Help me find a sharper niche angle. Give 5 positioning statements and the type of content each one would produce.\"],\n[\"Both\",\"Question bank\",\"Write 25 questions [audience] actually types into Google or asks in comments about [topic]. Each question becomes a post.\"],\n[\"Both\",\"Evergreen series\",\"Create 3 recurring weekly content series for [brand/creator]. Give each a name, a format, the posting day, and 4 example episodes.\"]]},\n{c:\"Hooks & Headlines\",d:\"Stop the scroll in the first line.\",items:[\n[\"Both\",\"10 scroll-stopping hooks\",\"Write 10 hooks for a post about [topic] aimed at [audience]. Use curiosity, a bold claim, a mistake, a number, and a story opener. Max 12 words each.\"],\n[\"Both\",\"Contrarian hook\",\"Give me 5 contrarian opinions about [topic] that [audience] would argue with but secretly agree with. Turn each into a one-line hook.\"],\n[\"Both\",\"Hook rewrite\",\"Here's my hook: [hook]. Rewrite it 7 ways: shorter, more specific, more emotional, more urgent, as a question, as a number, and as a 'stop doing X' line.\"],\n[\"Both\",\"Headline formulas\",\"Write 10 headlines for [blog post/video] about [topic] using proven formulas: how-to, listicle, 'why', 'the mistake', and 'what nobody tells you'.\"],\n[\"Creators\",\"Story opener\",\"Turn this experience into a story hook that makes people need to keep reading: [experience]. Give 5 versions under 15 words.\"],\n[\"Brands\",\"Product hook\",\"Write 8 hooks that introduce [product] by leading with the problem it solves for [audience], without mentioning the product in the first line.\"],\n[\"Both\",\"Thumbnail text\",\"Give me 10 options for YouTube thumbnail text (max 4 words) for a video titled [title]. Make them create curiosity without repeating the title.\"],\n[\"Both\",\"Email subject lines\",\"Write 15 email subject lines for [email topic]. Mix curiosity, benefit and urgency. Keep them under 45 characters and avoid spam words.\"],\n[\"Both\",\"First 3 seconds\",\"Write the first 3 seconds of a short-form video about [topic]: the spoken line, the on-screen text and the opening visual. Give 5 options.\"]]},\n{c:\"Captions & Copy\",d:\"Words that turn views into action.\",items:[\n[\"Both\",\"Caption in my voice\",\"Here are 3 captions I've written: [paste]. Study my tone, length and style. Now write a caption about [topic] that sounds exactly like me.\"],\n[\"Both\",\"Caption from notes\",\"Turn these messy notes into an engaging caption with a hook, 3 short value points and a call to action: [notes].\"],\n[\"Brands\",\"Benefit-driven product copy\",\"Write product copy for [product]. Turn each feature into a benefit for [audience]: [features]. Keep it scannable, under 120 words.\"],\n[\"Both\",\"CTA variations\",\"Write 10 calls to action for [goal: follow/sign up/buy/comment] that feel natural, not pushy, for [audience].\"],\n[\"Both\",\"LinkedIn post\",\"Write a LinkedIn post about [lesson/result] for [audience]. Short lines, one clear takeaway, a personal angle and a question at the end.\"],\n[\"Brands\",\"Ad copy set\",\"Write 5 Meta ad variations for [product] targeting [audience]: primary text (under 125 characters), headline and description. Angles: pain, desire, social proof, offer, urgency.\"],\n[\"Creators\",\"Bio rewrite\",\"Rewrite my bio for [platform] so a stranger knows in 3 seconds who I help, how, and why they should follow. My current bio: [bio]. Give 5 options.\"],\n[\"Both\",\"Objection crusher\",\"List the top 8 objections [audience] has before buying [product/offer]. Write a short, honest response to each that I can use in captions or FAQs.\"],\n[\"Both\",\"Testimonial into post\",\"Turn this testimonial into a post that tells the customer's before-and-after story without sounding like an ad: [testimonial].\"]]},\n{c:\"Video & Scripts\",d:\"Film faster with a plan.\",items:[\n[\"Both\",\"60-second script\",\"Write a 60-second video script about [topic] for [platform]. Include hook, 3 key points, a payoff and a CTA. Add on-screen text and B-roll notes.\"],\n[\"Both\",\"YouTube outline\",\"Outline a [length]-minute YouTube video titled [title]. Include a cold open, intro, chapters with timestamps, retention hooks between sections and an outro.\"],\n[\"Creators\",\"UGC script\",\"Write 3 UGC-style scripts for [product] by [brand]. Each under 30 seconds: hook, personal problem, product moment, result, CTA. Make it sound unscripted.\"],\n[\"Brands\",\"Founder story video\",\"Write a 90-second founder story script for [brand]. Cover the problem we saw, why we started, what makes us different, and an invitation to [audience].\"],\n[\"Both\",\"Shot list\",\"Create a shot list for a video about [topic] I can film at [location] in under 1 hour with just a phone. Include angles and the order to film them.\"],\n[\"Both\",\"Talking points\",\"I don't want a full script. Give me 5 bullet talking points for a video about [topic] so I can speak naturally on camera.\"],\n[\"Both\",\"Series of shorts\",\"Plan a 5-part short-form series on [topic]. Give each episode a hook, the one point it makes, and a cliffhanger into the next one.\"],\n[\"Creators\",\"Brand integration\",\"Write a natural 20-second sponsor integration for [brand/product] inside a video about [topic]. It should flow from the content and feel honest.\"]]},\n{c:\"Repurposing\",d:\"One idea, everywhere.\",items:[\n[\"Both\",\"1 video into 10 posts\",\"Here's a transcript: [paste]. Turn it into 10 pieces: 3 short-form clips (with timestamps), 2 carousels, 2 tweets/threads, 1 LinkedIn post, 1 email and 1 blog outline.\"],\n[\"Both\",\"Blog to carousel\",\"Turn this article into a 8-slide carousel. Slide 1 is the hook, slides 2-7 one idea each in under 25 words, slide 8 a CTA: [article].\"],\n[\"Both\",\"Thread from a post\",\"Turn this post into a 7-part thread that delivers more value with each part and ends with a CTA: [post].\"],\n[\"Both\",\"Newsletter from content\",\"Here are my posts from this week: [paste]. Turn them into a short newsletter with a personal intro, 3 key takeaways and one CTA.\"],\n[\"Both\",\"Best-performer remix\",\"This post did really well: [post]. Explain why it worked, then write 5 new posts that reuse the same structure on different topics.\"],\n[\"Both\",\"Clip finder\",\"From this transcript, pick the 5 strongest moments for short clips. For each, give the start and end line, why it works, and a caption: [transcript].\"],\n[\"Brands\",\"Case study to content\",\"Turn this case study into 6 posts for different platforms, each focused on one result or lesson: [case study].\"],\n[\"Both\",\"Podcast to quotes\",\"Pull 10 quotable lines from this transcript and format each as a quote graphic with a short supporting caption: [transcript].\"]]},\n{c:\"SEO, Blogs & Growth\",d:\"Get found and keep growing.\",items:[\n[\"Both\",\"Keyword ideas\",\"List 20 long-tail keywords [audience] searches when they need [product/topic]. Group them by search intent: learn, compare, buy.\"],\n[\"Both\",\"SEO blog outline\",\"Create an SEO outline for a blog post targeting [keyword]. Include title, meta description, H2s and H3s, FAQs and where to add internal links.\"],\n[\"Both\",\"Blog post draft\",\"Write a [word count]-word blog post on [topic] targeting [keyword]. Use short paragraphs, real examples, and write it so it sounds like a person, not a robot.\"],\n[\"Both\",\"Human edit pass\",\"Edit this AI draft so it sounds human: vary sentence length, cut filler words, add one personal example and remove anything generic: [draft].\"],\n[\"Brands\",\"Local SEO posts\",\"Write 5 Google Business Profile posts for [business] in [city] that mention local landmarks or events and drive [action].\"],\n[\"Creators\",\"Brand pitch email\",\"Write a short pitch email to [brand] from a creator with [audience size] followers in [niche]. Lead with value to them, include 2 content ideas and one stat, under 150 words.\"],\n[\"Both\",\"Content audit\",\"Here are my last 10 posts with their results: [paste]. Find the patterns in what worked and what didn't, and give me 5 changes for next month.\"],\n[\"Both\",\"Weekly AI review\",\"Act as my content coach. Here's what I posted and how it performed this week: [data]. Tell me what to double down on, what to drop and my top 3 priorities for next week.\"]]}\n];\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/<\u002Fg,\"&lt;\");\nconst hl=s=>esc(s).replace(/\\[([^\\]]+)\\]/g,\"<mark>[$1]<\u002Fmark>\");\nlet n=0,html=\"\",nav=\"\";\nP.forEach((g,i)=>{const id=\"c\"+(i+1);nav+=`<a href=\"#${id}\">${g.c}<\u002Fa>`;\nhtml+=`<section class=\"cat\" id=\"${id}\"><div class=\"cat-head\"><span class=\"cat-num\">0${i+1}<\u002Fspan><h2>${g.c}<\u002Fh2><p>${g.d}<\u002Fp><\u002Fdiv><div class=\"list\">`;\ng.items.forEach(([f,t,p])=>{n++;html+=`<article class=\"p\" data-s=\"${esc((t+\" \"+p+\" \"+f).toLowerCase())}\"><div class=\"p-top\"><span class=\"p-n\">#${String(n).padStart(2,\"0\")}<\u002Fspan><span class=\"p-for\">${f}<\u002Fspan><\u002Fdiv><h3>${t}<\u002Fh3><p class=\"p-text\">${hl(p)}<\u002Fp><button class=\"copy\" data-p=\"${esc(p).replace(/\"/g,\"&quot;\")}\">Copy prompt<\u002Fbutton><\u002Farticle>`});\nhtml+=`<\u002Fdiv><\u002Fsection>`});\ndocument.getElementById(\"main\").innerHTML=html;document.getElementById(\"cats\").innerHTML=nav;\ndocument.addEventListener(\"click\",e=>{const b=e.target.closest(\".copy\");if(!b)return;const t=b.getAttribute(\"data-p\");\nconst ok=()=>{b.textContent=\"Copied ✓\";b.classList.add(\"done\");setTimeout(()=>{b.textContent=\"Copy prompt\";b.classList.remove(\"done\")},1600)};\nif(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>{fb(t);ok()});else{fb(t);ok()}});\nfunction fb(t){const a=document.createElement(\"textarea\");a.value=t;a.style.position=\"fixed\";a.style.opacity=\"0\";document.body.appendChild(a);a.select();try{document.execCommand(\"copy\")}catch(e){}a.remove()}\ndocument.getElementById(\"search\").addEventListener(\"input\",e=>{const q=e.target.value.trim().toLowerCase();let any=0;\ndocument.querySelectorAll(\"section.cat\").forEach(s=>{let v=0;s.querySelectorAll(\".p\").forEach(p=>{const m=!q||p.dataset.s.includes(q);p.style.display=m?\"\":\"none\";if(m)v++});s.style.display=v?\"\":\"none\";any+=v});\ndocument.getElementById(\"empty\").style.display=any?\"none\":\"block\"});\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
